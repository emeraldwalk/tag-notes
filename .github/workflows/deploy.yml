name: Deploy to GitHub Pages

# Plan 8 moved the app to tracker.ingles.place (the Worker serves it, data in D1). Until the owner has exported
# from the old GitHub Pages app and imported into the new one, Pages must keep serving the last IndexedDB build:
# plan 6's commit (bca422c), which has Export All. So every push to main rebuilds that commit, never main's newer
# code, and other branches no longer deploy a preview. Delete this workflow when GitHub Pages is retired (plan 8's
# owner steps).

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bca422cda71e9fda96e7db21f6af1dcb34b312dd

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production, plan 6's IndexedDB app)
        run: npm run build -w tracker-pwa

      - name: Deploy (production)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pwa/dist
          destination_dir: .
          keep_files: true
